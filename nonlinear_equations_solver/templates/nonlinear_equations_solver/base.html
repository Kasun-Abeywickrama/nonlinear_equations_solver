<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Numerical Methods - Root Finder{% endblock %}</title>
    
    <!-- Fallback CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'nonlinear_equations_solver/css/fallback.css' %}">
    
    <!-- Tailwind CSS - CDN for development only -->
    <!-- For production, install as PostCSS plugin: https://tailwindcss.com/docs/installation -->
    <script src="https://cdn.tailwindcss.com" onerror="console.warn('Tailwind CSS CDN failed to load. Using fallback styles.')"></script>
    
    <!-- Plotly.js - Using specific version with fallback -->
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js" onerror="handlePlotlyError()"></script>
    <script>
        function handlePlotlyError() {
            console.warn('Plotly CDN failed to load. Trying alternative CDN...');
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/plotly.js@2.26.0/dist/plotly.min.js';
            script.onerror = function() {
                console.error('All Plotly CDNs failed. Plots will not be available.');
                window.plotlyUnavailable = true;
            };
            document.head.appendChild(script);
        }
    </script>
    
    <!-- MathJax for mathematical notation -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <!-- Custom CSS -->
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease-in-out;
        }
        
        .method-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .result-card {
            background: linear-gradient(145deg, #f8fafc, #ffffff);
        }
        
        .loading {
            display: none;
        }
        
        .loading.active {
            display: inline-block;
        }
        
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        
        /* Toast Notification Styles */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
            pointer-events: none;
        }
        
        .toast {
            pointer-events: auto;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s ease-in-out;
        }
        
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        .toast.hide {
            transform: translateX(100%);
            opacity: 0;
        }
        
        .toast-error {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border-left: 4px solid #ef4444;
            color: #b91c1c;
        }
        
        .toast-success {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border-left: 4px solid #22c55e;
            color: #166534;
        }
        
        .toast-warning {
            background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 100%);
            border-left: 4px solid #f59e0b;
            color: #92400e;
        }
        
        .toast-info {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border-left: 4px solid #3b82f6;
            color: #1d4ed8;
        }
        
        .toast-close {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .toast-close:hover {
            opacity: 1;
        }
        
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 8px 8px;
            animation: progress 5s linear forwards;
        }
        
        @keyframes progress {
            from { width: 100%; }
            to { width: 0%; }
        }
        
        /* Responsive adjustments */
        @media (max-width: 640px) {
            .toast-container {
                left: 20px;
                right: 20px;
                top: 20px;
                max-width: none;
            }
        }
    </style>
</head>
<body class="bbg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'nonlinear_equations_solver:index' %}" class="text-white sm:text-lg md:text-xl font-bold">
                        Numerical Methods
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{% url 'nonlinear_equations_solver:index' %}" 
                       class="text-white hover:text-gray-200 px-3 py-2 rounded-md text-sm font-medium">
                        Home
                    </a>
                    <a href="{% url 'nonlinear_equations_solver:theory' %}" 
                       class="text-white hover:text-gray-200 px-3 py-2 rounded-md text-sm font-medium">
                        Theory
                    </a>
                    <a href="{% url 'nonlinear_equations_solver:history' %}" 
                       class="text-white hover:text-gray-200 px-3 py-2 rounded-md text-sm font-medium">
                        History
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-12">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p>&copy; 2024 Numerical Methods for Nonlinear Equations</p>
                <p class="mt-2 text-gray-400">Implementing Bisection, Newton-Raphson, and Secant Methods</p>
            </div>
        </div>
    </footer>

    <!-- Global JavaScript -->
    <script>
        // CSRF token for Django
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        const csrftoken = getCookie('csrftoken');
        
        // Utility functions
        function showLoading(elementId) {
            document.getElementById(elementId).classList.add('active');
        }
        
        function hideLoading(elementId) {
            document.getElementById(elementId).classList.remove('active');
        }
        
        // Toast Notification System
        class ToastManager {
            constructor() {
                this.container = document.getElementById('toast-container');
                this.toasts = new Map();
                this.toastId = 0;
            }
            
            show(message, type = 'error', duration = 5000, persistent = false) {
                const id = ++this.toastId;
                const toast = this.createToast(id, message, type, duration, persistent);
                
                this.container.appendChild(toast);
                this.toasts.set(id, toast);
                
                // Trigger animation
                setTimeout(() => toast.classList.add('show'), 10);
                
                // Auto-remove if not persistent
                if (!persistent) {
                    setTimeout(() => this.hide(id), duration);
                }
                
                return id;
            }
            
            createToast(id, message, type, duration, persistent) {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type} p-4 max-w-sm w-full`;
                toast.dataset.toastId = id;
                
                const iconMap = {
                    error: '❌',
                    success: '✅', 
                    warning: '⚠️',
                    info: 'ℹ️'
                };
                
                const titleMap = {
                    error: 'Error',
                    success: 'Success',
                    warning: 'Warning',
                    info: 'Information'
                };
                
                toast.innerHTML = `
                    <div class="flex items-start">
                        <div class="flex-shrink-0">
                            <span class="text-lg">${iconMap[type] || '⚠️'}</span>
                        </div>
                        <div class="ml-3 flex-1">
                            <div class="font-bold text-sm">${titleMap[type] || 'Notification'}</div>
                            <div class="text-sm mt-1">${message}</div>
                        </div>
                        <div class="ml-4 flex-shrink-0">
                            <button class="toast-close text-lg" onclick="toastManager.hide(${id})">
                                ×
                            </button>
                        </div>
                    </div>
                    ${!persistent ? `<div class="toast-progress"></div>` : ''}
                `;
                
                return toast;
            }
            
            hide(id) {
                const toast = this.toasts.get(id);
                if (toast) {
                    toast.classList.add('hide');
                    setTimeout(() => {
                        if (toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                        this.toasts.delete(id);
                    }, 300);
                }
            }
            
            clear() {
                this.toasts.forEach((toast, id) => this.hide(id));
            }
        }
        
        // Initialize toast manager
        let toastManager;
        document.addEventListener('DOMContentLoaded', () => {
            toastManager = new ToastManager();
        });
        
        // Legacy functions for backward compatibility
        function showError(message, containerId = null) {
            if (toastManager) {
                toastManager.show(message, 'error', 8000);
            } else {
                // Fallback for immediate calls
                setTimeout(() => showError(message), 100);
            }
        }
        
        function showSuccess(message) {
            if (toastManager) {
                toastManager.show(message, 'success', 4000);
            }
        }
        
        function showWarning(message) {
            if (toastManager) {
                toastManager.show(message, 'warning', 6000);
            }
        }
        
        function showInfo(message) {
            if (toastManager) {
                toastManager.show(message, 'info', 5000);
            }
        }
        
        function clearError(containerId = null) {
            if (toastManager) {
                toastManager.clear();
            }
        }
        
        // Format numbers for display
        function formatNumber(num, decimals = 6) {
            if (num === null || num === undefined || isNaN(num)) return 'N/A';
            if (Math.abs(num) < 1e-10) return '0';
            return parseFloat(num).toFixed(decimals);
        }
        
        // Safe plot rendering
        function safePlotlyRender(elementId, plotData, layout, config) {
            const element = document.getElementById(elementId);
            if (!element) {
                console.warn(`Plot element ${elementId} not found`);
                return;
            }
            
            if (window.plotlyUnavailable || typeof Plotly === 'undefined') {
                element.innerHTML = `
                    <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-center">
                        <svg class="mx-auto h-12 w-12 text-yellow-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                        </svg>
                        <h3 class="text-lg font-medium text-yellow-800">Plot Unavailable</h3>
                        <p class="text-sm text-yellow-600 mt-1">Plotting library could not be loaded. Charts are temporarily unavailable.</p>
                    </div>
                `;
                return;
            }
            
            try {
                Plotly.newPlot(elementId, plotData, layout, config || {responsive: true});
            } catch (error) {
                console.error('Plot rendering error:', error);
                element.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-center">
                        <h3 class="text-lg font-medium text-red-800">Plot Error</h3>
                        <p class="text-sm text-red-600 mt-1">Unable to render plot: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        // Load test function
        function loadTestFunction(functionName) {
            fetch(`/api/test-function/${functionName}/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('function').value = data.expression;
                    // Set reasonable defaults based on function
                    if (data.domain) {
                        const [min, max] = data.domain;
                        document.getElementById('a').value = min;
                        document.getElementById('b').value = max;
                        document.getElementById('x0').value = (min + max) / 2;
                        document.getElementById('x1').value = max;
                    }
                })
                .catch(error => showError('Failed to load test function'));
        }
    </script>
    
    {% block extra_js %}
    {% endblock %}
</body>
</html>
